# Guards: every push and every pull request re-measures the claims in this repo.
#
# Why these steps: each one answers a question a reader would otherwise have to
# take on trust — do the tests pass, is the tree free of credentials and
# machine-local paths, does every example still produce the verdict published in
# tests/expected.json, do the prose and the tree agree, is the Hohfeld table the
# algebra it claims, and what does the status block say right now. The last step is printed for the log, not asserted: a status page
# that fails the build would be an opinion, not a measurement.
#
# No secrets are used here, and none are needed: the whole point of the checker
# is that it runs on a bare Python with no network and no packages.

name: guards

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests, secrets, examples, status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests (stdlib unittest, no dependencies)
        run: python tests/run_tests.py

      - name: Secrets and local absolute paths
        run: python lab/check-secrets.py


      # The audit of 2026-10-29 found three of twelve examples violating the published schema while every
      # gate was green: the schema was documentation and nothing validated the shipped data against it.
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema

      - name: Examples validate against the published schema
        run: python lab/check-examples-schema.py

      - name: Examples still match tests/expected.json
        run: python tools/check_examples.py

      # The owner's condition for shipping any software: the specification must be clear and
      # non-contradictory first. This pair is what "non-contradictory" means mechanically —
      # codes, fields, relations, squares, verdicts, examples and $refs must agree across the
      # documents, the schema and the checker. The selftest proves the guard is not decorative.
      - name: Spec consistency (codes, fields, relations, squares, verdicts, examples)
        run: python lab/check-spec.py

      - name: The consistency guard actually catches contradictions
        run: python lab/selftest-checkspec.py

      # The anchoring procedure is normalise-then-match (spec §5 rule 0, docs/26 §W6). Six of the
      # fourteen quotes in our first two measurements failed because we skipped the first half.
      - name: Span hint (normalise, then report byte-exact spans)
        run: python tests/run_span_tests.py

      # AGENTS §1: a number without a command is not a result. Until now that rule was asserted and
      # not checked — lexical drift between prose and tree was possible and already present. xcheck
      # (docs/30 §2) checks exactly this across the family, so we check it first, ourselves.
      - name: Numbers in prose agree with the tree
        run: python lab/check-prose-numbers.py

      - name: The prose guard actually catches drift
        run: python lab/selftest-prose.py

      # Nobody in the family had machine-checked the Hohfeld table: flowguard's review says so
      # explicitly. Our own guard compared cells, not the algebra they claim to satisfy.
      - name: The eight Hohfeld positions satisfy the algebra
        run: python lab/check-hohfeld.py

      - name: The Hohfeld guard actually catches a wrong table
        run: python lab/selftest-hohfeld.py

      # Two independent implementations of the quantity arithmetic (ADR-0002, docs/31 section 3):
      # the checker rounds with Decimal, the twin with integer divmod. Agreement is evidence.
      - name: The twin and the checker agree on the quantified examples
        run: |
          for f in examples/*.lex.json; do
            python tools/lexcheck_twin.py "$f" --allow-empty || exit 1
          done

      # Taken from VecDHT/​lab/check-guard-selftests.py: a guard whose zero is indistinguishable
      # from "did not look" protects as well as a disabled one. The catalogue is discovered
      # from the directory, and a baseline entry that stops applying is itself a finding.
      - name: Every guard can fail, and something runs it
        run: python lab/check-guard-catalog.py

      # The bench discipline: a result names its pre-registration, a frozen prediction cannot be
      # re-pointed at an edited file, and an open forecast expires. From the family's bench practice.
      - name: Pre-registered hypotheses, frozen snapshots, expiring forecasts
        run: python lab/check-experiments.py

      - name: Status block
        run: python tools/lexspec_status.py

  # The network is not the repository's business, so provenance liveness is not on the push path. It runs weekly and
  # on demand: a cited address that stops answering does not change a verdict (the bytes are pinned), but it does
  # change whether our provenance claim can be checked at all.
  citations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cited sources still answer
        run: python lab/check-citations.py --timeout 20
